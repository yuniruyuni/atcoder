[package]
name = "abc176-b"
version = "0.1.0"
authors = ["yuniruyuni <yuniruyuni@gmail.com>"]
edition = "2018"

[[bin]]
name = "abc176-b"
path = "src/main.rs"

[dependencies]
proconio = { version = "=0.3.6", features = ["derive"] }
text_io = "=0.1.8"
whiteread = "=0.5.0"
num = "=0.2.1"
num-bigint = "=0.2.6"
num-complex = "=0.2.4"
num-integer = "=0.1.42"
num-iter = "=0.1.40"
num-rational = "=0.2.4"
num-traits = "=0.2.11"
num-derive = "=0.3.0"
ndarray = "=0.13.0"
nalgebra = "=0.27.1"
alga = "=0.9.3"
libm = "=0.2.1"
rand = { version = "=0.8.6", features = ["small_rng"] }
getrandom = "=0.2.16"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
rand_hc = "=0.3.2"
rand_pcg = "=0.3.1"
rand_distr = "=0.4.3"
petgraph = "=0.5.0"
indexmap = "=1.3.2"
regex = "=1.12.4"
lazy_static = "=1.4.0"
ordered-float = "=1.1.1"
ascii = "=1.0.0"
permutohedron = "=0.2.4"
superslice = "=1.0.0"
itertools = "=0.9.0"
itertools-num = "=0.1.3"
maplit = "=1.0.2"
either = "=1.5.3"
fixedbitset = "=0.2.0"
bitset-fixed = "=0.1.0"
rustc-hash = "=1.1.0"
smallvec = "=1.15.1"

[dev-dependencies]
cli_test_dir = "*"
unindent = "*"
